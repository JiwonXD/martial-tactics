# 웹게임 배포: dev에 올라오면 web/ 화면 + 전투 엔진을 묶어 gh-pages 브랜치에 올린다 (GitHub Pages가 그 브랜치를 보여 줌)
name: 웹게임 배포

on:
  push:
    branches: [dev]
    paths: ['web/**', 'tools/web-sim/engine.js', '.github/workflows/web-game.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-game
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/web-sim/test.js > /dev/null
      - run: node web/test.js
      - run: node web/build.js
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: web/dist
          publish_branch: gh-pages
          force_orphan: true
