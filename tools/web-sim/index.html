<title>무림 대결 시뮬레이터</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 레이아웃: 위에 두 문파의 편성판을 마주 세우고, 아래에 승률 → 전투 로그 순으로 결과를 쌓는다 */
:root {
  --paper: #eef1ec;
  --panel: #f8faf6;
  --ink: #1b2421;
  --ink-soft: #5a6862;
  --line: #cfd8d2;
  --jade: #2f6b5e;
  --jade-tint: #dbe9e3;
  --crimson: #9a3b3b;
  --crimson-tint: #f1dede;
  --draw: #a8b2ac;
  --warn: #9a6a12;
  --font-display: "Gowun Batang", "Nanum Myeongjo", serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #121715; --panel: #1a211e; --ink: #e3e8e4; --ink-soft: #9aa8a1; --line: #2e3833;
    --jade: #6fb3a0; --jade-tint: #1f3530; --crimson: #d98383; --crimson-tint: #3a2222; --draw: #5d6863; --warn: #e0b45c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #121715; --panel: #1a211e; --ink: #e3e8e4; --ink-soft: #9aa8a1; --line: #2e3833;
  --jade: #6fb3a0; --jade-tint: #1f3530; --crimson: #d98383; --crimson-tint: #3a2222; --draw: #5d6863; --warn: #e0b45c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 48px;
}
.wrap { max-width: 1120px; margin: 0 auto; display: grid; gap: 24px; }
header h1 { font-family: var(--font-display); font-size: 30px; font-weight: 700; margin: 0; letter-spacing: 0.02em; text-wrap: balance; }
header p { margin: 4px 0 0; color: var(--ink-soft); max-width: 68ch; }

.teams { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 860px) { .teams { grid-template-columns: 1fr; } }
.team { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 16px; display: grid; gap: 12px; min-width: 0; border-top: 3px solid var(--side); }
.team[data-side="A"] { --side: var(--jade); --side-tint: var(--jade-tint); }
.team[data-side="B"] { --side: var(--crimson); --side-tint: var(--crimson-tint); }
.team-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.team-head h2 { font-family: var(--font-display); font-size: 20px; margin: 0; color: var(--side); }
.team-head select { max-width: 100%; }
.row-label { font-size: 11.5px; letter-spacing: 0.08em; color: var(--ink-soft); }
.elements { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.el-btn { font-family: var(--font-display); font-size: 16px; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: transparent; color: var(--ink); cursor: pointer; }
.el-btn[aria-pressed="true"] { background: var(--side); border-color: var(--side); color: var(--panel); }
.el-note { font-size: 12px; color: var(--ink-soft); margin-left: 4px; }

.slot { display: grid; grid-template-columns: 52px 1fr; gap: 6px 10px; padding-top: 12px; border-top: 1px solid var(--line); }
.pos { font-family: var(--font-display); font-weight: 700; font-size: 15px; color: var(--side); padding-top: 6px; }
.slot-body { display: grid; gap: 6px; min-width: 0; }
.picks { display: grid; grid-template-columns: 1.2fr 1fr 1fr; gap: 6px; }
@media (max-width: 520px) { .picks { grid-template-columns: 1fr; } }
select, input[type="number"] {
  font: inherit; font-size: 13px; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; min-width: 0; width: 100%;
}
select:focus-visible, input:focus-visible, button:focus-visible { outline: 2px solid var(--side, var(--jade)); outline-offset: 2px; }
.meta { font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.apt { display: inline-block; min-width: 18px; text-align: center; font-family: var(--font-data); font-weight: 500; border-radius: 3px; padding: 0 4px; background: var(--side-tint); color: var(--side); }
.apt[data-g="C"] { background: transparent; color: var(--warn); border: 1px solid var(--warn); }
.skills-line { font-size: 12.5px; display: grid; gap: 2px; }
.skills-line b { font-weight: 600; }
.type-tag { font-size: 11px; color: var(--ink-soft); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; margin-right: 4px; }
.bonus { font-size: 12.5px; color: var(--ink-soft); }
.errors { color: var(--crimson); font-size: 12.5px; margin: 0; padding-left: 18px; }

.controls { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.btn { font: inherit; font-weight: 600; border-radius: 4px; padding: 9px 16px; cursor: pointer; border: 1px solid var(--jade); }
.btn.primary { background: var(--jade); color: var(--panel); }
.btn.ghost { background: transparent; color: var(--jade); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.controls label { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
.controls select { width: auto; }
details.rules { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px 14px; }
details.rules summary { cursor: pointer; font-weight: 600; }
.rule-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-top: 10px; }
.rule-grid label { display: grid; gap: 4px; font-size: 12.5px; color: var(--ink-soft); }

section.result { display: grid; gap: 12px; }
section.result h2 { font-family: var(--font-display); font-size: 20px; margin: 0; }
.verdict { font-size: 15px; }
.bar { display: flex; height: 28px; border-radius: 4px; overflow: hidden; border: 1px solid var(--line); font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
.bar span { display: flex; align-items: center; justify-content: center; color: var(--panel); white-space: nowrap; overflow: hidden; }
.bar .a { background: var(--jade); }
.bar .d { background: var(--draw); color: var(--ink); }
.bar .b { background: var(--crimson); }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.table-wrap { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { padding: 7px 10px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-weight: 600; font-size: 12px; color: var(--ink-soft); background: var(--paper); }
td:first-child, th:first-child, td:nth-child(2), th:nth-child(2) { text-align: left; }
tr[data-side="A"] td:first-child { color: var(--jade); font-weight: 600; }
tr[data-side="B"] td:first-child { color: var(--crimson); font-weight: 600; }
td .procs { color: var(--ink-soft); font-size: 12px; }
td.wrap-cell { white-space: normal; text-align: left; min-width: 220px; }
.dealt-bar { display: inline-block; height: 6px; border-radius: 3px; background: var(--side-color); vertical-align: middle; margin-left: 6px; }

.log { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; max-height: 560px; overflow-y: auto; font-size: 13px; }
.log .round { position: sticky; top: 0; background: var(--paper); font-family: var(--font-display); font-weight: 700; padding: 6px 14px; border-bottom: 1px solid var(--line); }
.log ol { list-style: none; margin: 0; padding: 6px 14px 10px; display: grid; gap: 2px; }
.log li { overflow-wrap: anywhere; }
.log .sa { color: var(--jade); font-weight: 600; }
.log .sb { color: var(--crimson); font-weight: 600; }
.log .ko { font-weight: 600; }
.log-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.log-head .meta { font-family: var(--font-data); }
footer { font-size: 12px; color: var(--ink-soft); }
@media (prefers-reduced-motion: no-preference) { .bar span { transition: flex-basis 0.4s ease; } }
</style>

<div class="wrap">
  <header>
    <h1>무림 대결 시뮬레이터</h1>
    <p>세 무인으로 두 문파를 편성하고 자동 대결을 돌려 봅니다. 규칙은 전투 시스템 기획서 초안을 따르며, 무인과 무공 수치는 모두 예시입니다.</p>
  </header>

  <div class="teams">
    <div class="team" data-side="A" id="team-A"></div>
    <div class="team" data-side="B" id="team-B"></div>
  </div>

  <div class="controls">
    <button class="btn primary" id="run-many" type="button">1,000판 돌리기</button>
    <button class="btn ghost" id="run-one" type="button">한 판 보기</button>
  </div>

  <details class="rules">
    <summary>규칙 수치 조정</summary>
    <div class="rule-grid">
      <label for="cfg-baseDmg">기본 피해 B<input type="number" id="cfg-baseDmg" step="10" min="0"></label>
      <label for="cfg-statK">스탯차 계수 k<input type="number" id="cfg-statK" step="0.1" min="0"></label>
      <label for="cfg-counterBonus">오행 상극 보정 (0.15 = ±15%)<input type="number" id="cfg-counterBonus" step="0.05" min="0" max="1"></label>
      <label for="cfg-factionBonus">같은 세력 3명 보너스<input type="number" id="cfg-factionBonus" step="0.05" min="0" max="1"></label>
      <label for="cfg-rounds">최대 합 수<input type="number" id="cfg-rounds" step="1" min="1" max="20"></label>
    </div>
  </details>

  <section class="result" id="many-result" aria-live="polite"></section>
  <section class="result" id="one-result"></section>

  <footer>피해 = (B + max(0, 공격 − 방어) × k) × 무공 계수 × 속성 상극 × 체력 보정(0.6 + 0.4 × 남은 체력 비율) × 0.9~1.1. 주장이 쓰러지면 패배. 8합이 지나면 남은 체력 비율(남은 체력 합 ÷ 최대 체력 합)이 높은 쪽이 승리, 같으면 무승부.</footer>
</div>

<script src="engine.js"></script>
<script>
(function () {
  const S = window.WuxiaSim;
  const PRESETS = {
    jeong: { label: '정파 (청운검주 문하)', team: { element: '금', slots: [
      { unit: 'baek', skills: ['bukdu', 'cheongsim'] }, { unit: 'seol', skills: ['jeomhyeol', 'naesang'] }, { unit: 'hye', skills: ['saja', 'bantan'] } ] } },
    ma: { label: '마교 (만독곡 연합)', team: { element: '화', slots: [
      { unit: 'dok', skills: ['jujak', 'seophon'] }, { unit: 'hyeol', skills: ['gwangpung', 'sangong'] }, { unit: 'cheol', skills: ['hoechun', 'bantan'] } ] } },
    mix: { label: '세가·사파 (남궁 협객단)', team: { element: '목', slots: [
      { unit: 'namgung', skills: ['cheongryong', 'gwangpung'] }, { unit: 'dang', skills: ['jeomhyeol', 'sangong'] }, { unit: 'nameless', skills: ['saja', 'bantan'] } ] } },
    dol: { label: '세가·마교·사파 (주장 저격)', team: { element: '금', slots: [
      { unit: 'paeng', skills: ['bukdu', 'gwangpung'] }, { unit: 'sahyeol', skills: ['hyeolma', 'changgung'] }, { unit: 'jangsam', skills: ['naesang', 'ildo'] } ] } },
  };
  const clone = t => JSON.parse(JSON.stringify(t));
  const state = { A: clone(PRESETS.jeong.team), B: clone(PRESETS.ma.team) };
  const NAMES = { A: '아군', B: '상대' };
  const OWNER = Object.fromEntries(S.UNITS.map(u => [u.skill, u]));
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  function teamSkillIds(team) {
    const ids = [];
    team.slots.forEach(s => { if (S.UNIT[s.unit]) ids.push(S.UNIT[s.unit].skill); s.skills.forEach(x => x && ids.push(x)); });
    return ids;
  }

  function renderTeam(side) {
    const team = state[side];
    const el = document.getElementById('team-' + side);
    const ei = S.ELEMENTS.indexOf(team.element);
    const used = teamSkillIds(team);
    const usedUnits = team.slots.map(s => s.unit);
    const factions = team.slots.map(s => S.UNIT[s.unit] && S.UNIT[s.unit].faction);
    const sameFaction = factions.every(f => f && f === factions[0]);
    const beats = S.BEATS[team.element];
    const beatenBy = S.ELEMENTS.find(e => S.BEATS[e] === team.element);

    let html = `<div class="team-head"><h2>${NAMES[side]}</h2>
      <select id="preset-${side}" aria-label="${NAMES[side]} 샘플 편성 불러오기">
        <option value="">샘플 편성 불러오기</option>
        ${Object.entries(PRESETS).map(([k, p]) => `<option value="${k}">${p.label}</option>`).join('')}
      </select></div>
      <div class="elements" role="group" aria-label="속성">
        <span class="row-label">속성</span>
        ${S.ELEMENTS.map(e => `<button type="button" class="el-btn" data-el="${e}" aria-pressed="${e === team.element}">${e}</button>`).join('')}
        <span class="el-note">${team.element}은(는) ${beats}을(를) 이기고 ${beatenBy}에 진다</span>
      </div>`;

    team.slots.forEach((slot, i) => {
      const u = S.UNIT[slot.unit];
      const unitOpts = S.UNITS.map(x => `<option value="${x.id}" ${x.id === slot.unit ? 'selected' : ''} ${x.id !== slot.unit && usedUnits.includes(x.id) ? 'disabled' : ''}>${x.name} · ${x.faction} · ${team.element} ${x.apt[ei]}</option>`).join('');
      const skillSelect = (k) => {
        const cur = slot.skills[k];
        const groups = ['formation', 'aura', 'active', 'chase', 'passive'].map(type => {
          const opts = S.SKILLS.filter(s => s.type === type).map(s =>
            `<option value="${s.id}" ${s.id === cur ? 'selected' : ''} ${s.id !== cur && used.includes(s.id) ? 'disabled' : ''}>${s.name}${s.rate ? ' ' + s.rate + '%' : ''} · ${OWNER[s.id].name}${type === 'formation' ? ` · ${s.element} 속성${i !== 0 ? ' (주장 전용)' : ''}` : ''}</option>`).join('');
          return opts ? `<optgroup label="${S.TYPE_NAMES[type]}">${opts}</optgroup>` : '';
        }).join('');
        return `<select id="skill-${side}-${i}-${k}" data-slot="${i}" data-k="${k}" aria-label="${i + 1}번 ${S.POS_NAMES[i]} 무공 ${k + 2}칸"><option value="">(비움)</option>${groups}</select>`;
      };
      const skills = [u.skill, ...slot.skills].filter(Boolean).map((id, n) => {
        const s = S.SKILL[id];
        const off = s.type === 'formation' && i !== 0 ? '주장이 아니라 발동 안 함'
          : s.type === 'formation' && s.element !== team.element ? `팀 속성이 ${s.element}가 아니라 발동 안 함` : '';
        return `<div><span class="type-tag">${S.TYPE_NAMES[s.type]}</span><b>${s.name}</b>${s.rate ? ` ${s.rate}%` : ''}${n === 0 ? ' (자기 무공)' : ` (${OWNER[id].name}에게서 추출)`} · ${esc(s.desc)}${off ? ` <span style="color:var(--warn)">(${off})</span>` : ''}</div>`;
      }).join('');
      html += `<div class="slot"><div class="pos">${S.POS_NAMES[i]}</div><div class="slot-body">
        <div class="picks">
          <select id="unit-${side}-${i}" data-slot="${i}" aria-label="${i + 1}번 ${S.POS_NAMES[i]} 무인">${unitOpts}</select>
          ${skillSelect(0)}${skillSelect(1)}
        </div>
        <div class="meta">${u.title} · 적성 <span class="apt" data-g="${u.apt[ei]}">${u.apt[ei]}</span> (×${S.APT_MULT[u.apt[ei]]}) · 체력 ${u.hp} · 외공 ${u.ext} · 내공 ${u.int} · 호신 ${u.def} · 경공 ${u.spd}</div>
        <div class="skills-line">${skills}</div>
      </div></div>`;
    });
    html += `<div class="bonus">${sameFaction ? `세력 보너스: ${factions[0]} 3명, 전 스탯 +${Math.round(S.CFG.factionBonus * 100)}%` : '세력 보너스 없음 (세력이 섞임)'}</div>`;
    const errors = S.validateTeam(team);
    if (errors.length) html += `<ul class="errors">${errors.map(e => `<li>${esc(e)}</li>`).join('')}</ul>`;
    el.innerHTML = html;

    el.querySelectorAll('.el-btn').forEach(b => b.addEventListener('click', () => { team.element = b.dataset.el; renderTeam(side); }));
    el.querySelector(`#preset-${side}`).addEventListener('change', e => { if (PRESETS[e.target.value]) { state[side] = clone(PRESETS[e.target.value].team); renderTeam(side); } });
    el.querySelectorAll('select[id^="unit-"]').forEach(s => s.addEventListener('change', () => { team.slots[+s.dataset.slot].unit = s.value; renderTeam(side); }));
    el.querySelectorAll('select[id^="skill-"]').forEach(s => s.addEventListener('change', () => { team.slots[+s.dataset.slot].skills[+s.dataset.k] = s.value || null; renderTeam(side); }));
    updateButtons();
  }

  function updateButtons() {
    const ok = !S.validateTeam(state.A).length && !S.validateTeam(state.B).length;
    document.getElementById('run-many').disabled = !ok;
    document.getElementById('run-one').disabled = !ok;
  }

  const pct = (x, n) => (x / n * 100).toFixed(1) + '%';

  function runMany() {
    const n = 1000;
    const r = S.simulate(state.A, state.B, n, { seed: Date.now() % 100000 });
    const lead = r.A > r.B ? `아군이 ${pct(r.A, n)}로 우세합니다.` : r.B > r.A ? `상대가 ${pct(r.B, n)}로 우세합니다.` : '두 팀의 승률이 같습니다.';
    const maxDealt = Math.max(...r.units.map(u => u.dealt));
    const rows = r.units.map(u => {
      const w = Math.round(u.dealt / maxDealt * 80);
      const procs = Object.entries(u.procs).map(([id, c]) => `${S.SKILL[id].name} ${(c / n).toFixed(1)}`).join(', ') || '없음';
      return `<tr data-side="${u.side}"><td>${NAMES[u.side]}</td><td>${S.POS_NAMES[u.pos]} ${u.name}</td>
        <td>${Math.round(u.dealt / n).toLocaleString()}<span class="dealt-bar" style="width:${w}px;--side-color:var(${u.side === 'A' ? '--jade' : '--crimson'})"></span></td>
        <td>${Math.round(u.healed / n).toLocaleString()}</td><td>${Math.round(u.taken / n).toLocaleString()}</td><td>${pct(u.deaths, n)}</td>
        <td class="wrap-cell"><span class="procs">${procs}</span></td></tr>`;
    }).join('');
    document.getElementById('many-result').innerHTML = `
      <h2>1,000판 결과</h2>
      <div class="verdict">${lead} 평균 ${r.avgRounds.toFixed(1)}합에 끝났습니다.</div>
      <div class="bar" role="img" aria-label="아군 승 ${pct(r.A, n)}, 무승부 ${pct(r.draw, n)}, 상대 승 ${pct(r.B, n)}">
        <span class="a" style="flex-basis:${r.A / n * 100}%">${r.A / n > 0.08 ? pct(r.A, n) : ''}</span>
        <span class="d" style="flex-basis:${r.draw / n * 100}%">${r.draw / n > 0.08 ? pct(r.draw, n) : ''}</span>
        <span class="b" style="flex-basis:${r.B / n * 100}%">${r.B / n > 0.08 ? pct(r.B, n) : ''}</span>
      </div>
      <div class="legend"><span><i style="background:var(--jade)"></i>아군 승 ${r.A}</span><span><i style="background:var(--draw)"></i>무승부 ${r.draw}</span><span><i style="background:var(--crimson)"></i>상대 승 ${r.B}</span></div>
      <div class="table-wrap"><table>
        <thead><tr><th>팀</th><th>무인</th><th>평균 피해</th><th>평균 회복</th><th>받은 피해</th><th>쓰러짐</th><th>판당 무공 발동 횟수</th></tr></thead>
        <tbody>${rows}</tbody></table></div>`;
  }

  function runOne() {
    const seed = Math.floor(Math.random() * 1e9);
    const r = new S.Battle(state.A, state.B, { seed, log: true }).run();
    const verdict = r.winner ? `${NAMES[r.winner]} 승리 (${r.rounds}합)` : `무승부 (${r.rounds}합 종료)`;
    const groups = [];
    r.log.forEach(l => {
      if (!groups.length || groups[groups.length - 1].round !== l.round) groups.push({ round: l.round, lines: [] });
      if (/^\d+합$|^준비 합$/.test(l.text)) return;
      groups[groups.length - 1].lines.push(l.text);
    });
    const fmt = t => esc(t).replace(/\[아\] ([^\s:의]+)/g, '<span class="sa">$1</span>').replace(/\[적\] ([^\s:의]+)/g, '<span class="sb">$1</span>');
    const body = groups.map(g => `<div class="round">${g.round === 0 ? '준비 합' : `${g.round}합`}</div><ol>${g.lines.map(t => `<li class="${t.endsWith('쓰러짐') ? 'ko' : ''}">${fmt(t)}</li>`).join('')}</ol>`).join('');
    const hpLine = r.units.map(u => `${u.side === 'A' ? '아' : '적'}·${u.name} ${u.hp}/${u.maxHp}`).join(' · ');
    document.getElementById('one-result').innerHTML = `
      <div class="log-head"><h2>한 판 전투 로그</h2><span class="meta">시드 ${seed}</span></div>
      <div class="verdict">${verdict}</div>
      <div class="meta">${esc(hpLine)}</div>
      <div class="log">${body}</div>`;
  }

  ['baseDmg', 'statK', 'counterBonus', 'factionBonus', 'rounds'].forEach(k => {
    const input = document.getElementById('cfg-' + k);
    input.value = S.CFG[k];
    input.addEventListener('change', () => {
      const v = parseFloat(input.value);
      if (Number.isFinite(v) && v >= 0) { S.CFG[k] = k === 'rounds' ? Math.max(1, Math.round(v)) : v; renderTeam('A'); renderTeam('B'); }
      else input.value = S.CFG[k];
    });
  });
  document.getElementById('run-many').addEventListener('click', runMany);
  document.getElementById('run-one').addEventListener('click', runOne);

  renderTeam('A'); renderTeam('B');
  runMany(); runOne();
})();
</script>
